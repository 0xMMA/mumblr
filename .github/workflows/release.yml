name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Mumblr.App/Mumblr.App.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Pack
        run: >
          vpk pack
          --packId mumblr
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe mumblr.exe
          --packTitle mumblr
          --packAuthors "0xMMA"
          --icon src/Mumblr.App/Assets/mumblr.ico
          --outputDir releases
          --releaseNotes RELEASE_NOTES.md

      - name: Upload the release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag ${{ steps.version.outputs.tag }}
          --releaseName "mumblr ${{ steps.version.outputs.version }}"
          --targetCommitish ${{ github.sha }}
          --merge
          --publish

      - uses: actions/upload-artifact@v4
        with:
          name: mumblr-win-x64
          path: releases/*
