name: release

# A tag is the only way to release. A manual trigger could name a version the binary does not
# carry - MinVer reads the tags at the checked out commit, not the input - and the mismatch would
# only be visible after the package was published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the version and the channel
        id: version
        shell: pwsh
        # The ref name goes through the environment, never into the script text: git allows an
        # apostrophe in a tag name, and expanding one straight into a quoted PowerShell string is
        # how that becomes arbitrary code on the runner.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''

          # [regex]::Match rather than -notmatch: -notmatch fills $Matches only as a side effect of
          # returning false, which is exactly the branch that is not taken here.
          $parsed = [regex]::Match($version, '^\d+\.\d+\.\d+(?:-(?<suffix>[0-9A-Za-z.-]+))?$')
          if (-not $parsed.Success) {
            throw "Tag '$($env:REF_NAME)' is not a version tag"
          }
          $suffix = $parsed.Groups['suffix'].Value

          # Two channels, and the tag decides which one. Velopack bakes the channel into the
          # package, and an installed build only ever reads releases.<its own channel>.json - so a
          # build that lands in the wrong feed is invisible to everyone rather than merely
          # mislabelled. An unplanned suffix therefore stops here instead of being guessed at.
          if (-not $suffix) {
            $channel = 'win'
            $pre = 'false'
          } elseif ($suffix -match '^beta\.\d+$') {
            $channel = 'win-beta'
            $pre = 'true'
          } else {
            throw "Tag '$($env:REF_NAME)' names no release channel. Use vX.Y.Z or vX.Y.Z-beta.N"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "pre=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version on channel $channel (prerelease: $pre)"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Mumblr.App/Mumblr.App.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      # Pinned to the Velopack the app references. The tool decides the asset names and the
      # channel layout, a release cannot be rehearsed, and "whatever was latest that day" is not a
      # thing anyone can reproduce afterwards. Bump both in one commit.
      - name: Install Velopack
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack
        run: >
          vpk pack
          --packId mumblr
          --packVersion ${{ steps.version.outputs.version }}
          --channel ${{ steps.version.outputs.channel }}
          --packDir publish
          --mainExe mumblr.exe
          --packTitle mumblr
          --packAuthors "0xMMA"
          --icon src/Mumblr.App/Assets/mumblr.ico
          --outputDir releases
          --releaseNotes RELEASE_NOTES.md

      - name: Upload the release
        shell: pwsh
        env:
          # Not on the command line: arguments are readable by every other process on the runner.
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:VPK_TOKEN
          --outputDir releases
          --channel ${{ steps.version.outputs.channel }}
          --tag ${{ steps.version.outputs.tag }}
          --releaseName "mumblr ${{ steps.version.outputs.version }}"
          --targetCommitish ${{ github.sha }}
          --pre ${{ steps.version.outputs.pre }}
          --merge
          --publish

      # Renaming on disk before the upload does not work: vpk reads the file names from its own
      # manifest rather than from the directory, and dies with "Could not find file". So the
      # assets are renamed on the release afterwards. Only the .nupkg is referenced by
      # releases.<channel>.json, so the installer and the portable zip are free to be renamed -
      # and a Downloads folder holding mumblr-win-Setup.exe, mumblr-win-Setup(1).exe and
      # mumblr-win-Setup(2).exe tells you nothing about which build is which.
      #
      # The names carry the channel because vpk puts it there: the installer for channel win-beta
      # is mumblr-win-beta-Setup.exe. Matching is against that prefix rather than a pattern, so a
      # channel with a dash or a dot in it needs no escaping.
      - name: Name the release assets after the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $channel = '${{ steps.version.outputs.channel }}'
          $prefix = "mumblr-$channel-"
          $renamed = 0

          $assets = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | "\(.id) \(.name)"'
          if ($LASTEXITCODE -ne 0) { throw "Could not read the release assets for $tag" }

          foreach ($line in $assets) {
            $id, $name = $line -split ' ', 2
            if ($name -ne "${prefix}Setup.exe" -and $name -ne "${prefix}Portable.zip") { continue }

            $target = "mumblr-$version-$channel-" + $name.Substring($prefix.Length)
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f name="$target" | Out-Null

            # gh does not throw on a failed call. Counting the attempt instead of the result let a
            # re-run - where the new upload collides with an already renamed asset - report success
            # while both renames were refused.
            if ($LASTEXITCODE -ne 0) { throw "Renaming $name to $target failed" }

            Write-Host "$name -> $target"
            $renamed++
          }

          if ($renamed -ne 2) { throw "Expected to rename the installer and the portable zip, renamed $renamed" }

      - uses: actions/upload-artifact@v4
        with:
          name: mumblr-${{ steps.version.outputs.channel }}-x64
          path: releases/*
